<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ছোটদের মজার পাঠশালা</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'SolaimanLipi', 'Segoe UI', Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      padding: 15px;
      text-align: center;
    }
    
    /* বাচ্চার ছবির সেকশন */
    .photo-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      margin-bottom: 15px;
    }
    .photo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .baby-photo {
      width: 130px;       
      height: 130px;      
      border-radius: 50%; 
      border: 5px solid #fff; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      object-fit: cover;  
      background-color: #eee;
    }
    .baby-name {
      margin-top: 8px;
      font-weight: bold;
      color: #ff3366;
      background: white;
      padding: 4px 15px;
      border-radius: 20px;
      font-size: 1rem;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    h1 {
      color: #ff3366;
      font-size: 2.2rem;
      text-shadow: 2px 2px #ffe600;
      margin-bottom: 25px;
      padding: 10px;
    }
    .menu-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }
    .menu-btn {
      padding: 10px 18px;
      font-size: 1.05rem;
      font-weight: bold;
      border: 3px solid #fff;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s, filter 0.2s;
    }
    .menu-btn:hover, .menu-btn.active {
      transform: scale(1.06);
      filter: brightness(1.1);
    }
    .btn-1 { background-color: #ff7675; color: white; }
    .btn-2 { background-color: #74b9ff; color: white; }
    .btn-3 { background-color: #55efc4; color: #2d3436; }
    .btn-4 { background-color: #ffeaa7; color: #d63031; }
    .btn-5 { background-color: #a29bfe; color: white; }
    .btn-6 { background-color: #fdcb6e; color: #2d3436; }

    .content-section {
      display: none;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 1050px;
      margin: 0 auto;
    }
    .content-section.active-section {
      display: block;
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
      font-size: 1.5rem;
    }
    .sub-title {
      font-size: 1.4rem;
      color: #0984e3;
      margin: 25px 0 15px;
      padding-bottom: 8px;
      border-bottom: 2px dashed #74b9ff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 15px;
      justify-items: center;
    }

    .card {
      background: white;
      border: 3px solid #ffbe76;
      border-radius: 15px;
      width: 100%;
      padding: 12px 5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    }
    .card .icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    .card .title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2d3436;
    }
    .card .subtext {
      font-size: 0.9rem;
      color: #636e72;
      margin-top: 5px;
    }
    .color-box {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 3px solid #ecf0f1;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
    }
    .num-card {
      padding: 10px 5px;
      font-weight: bold;
      font-size: 1.3rem;
      color: #0984e3;
      border-color: #81ecec;
    }
  </style>
</head>
<body>

  <!-- দুই মেয়ের ছবি ও নামের অংশ -->
  <div class="photo-container">
    <div class="photo-wrapper">
      <img src="adira.png" alt="আদিরা" class="baby-photo">
      <span class="baby-name">আদিরা</span>
    </div>
    <div class="photo-wrapper">
      <img src="sanvi_adira.png" alt="সানভি আদিরা" class="baby-photo">
      <span class="baby-name">সানভি আদিরা</span>
    </div>
  </div>

  <h1>🎨 ছোটদের মজার পাঠশালা 🎒</h1>

  <!-- প্রধান মেনুবার -->
  <div class="menu-bar">
    <button class="menu-btn btn-1 active" onclick="showSection('colors', this)">১. রঙের পরিচয়</button>
    <button class="menu-btn btn-2" onclick="showSection('bangla', this)">২. বাংলা বর্ণ ও সংখ্যা</button>
    <button class="menu-btn btn-3" onclick="showSection('english', this)">৩. ইংরেজি বর্ণ ও 1-100</button>
    <button class="menu-btn btn-4" onclick="showSection('countries', this)">৪. বিভিন্ন দেশ</button>
    <button class="menu-btn btn-5" onclick="showSection('oceans', this)">৫. মহাসাগরের পরিচয়</button>
    <button class="menu-btn btn-6" onclick="showSection('animals', this)">৬. জীবজন্তুর পরিচয়</button>
  </div>

  <!-- ১. রঙের পরিচয় -->
  <div id="colors" class="content-section active-section">
    <h2>রঙের বোতামে চাপ দিলে ইংরেজি নাম শোনা যাবে</h2>
    <div class="grid" id="colors-grid"></div>
  </div>

  <!-- ২. বাংলা বর্ণমালা ও সংখ্যা -->
  <div id="bangla" class="content-section">
    <h3 class="sub-title">স্বরবর্ণ</h3>
    <div class="grid" id="swar-grid"></div>

    <h3 class="sub-title">ব্যঞ্জনবর্ণ</h3>
    <div class="grid" id="byanjan-grid"></div>

    <h3 class="sub-title">একে চন্দ্র, দুয়ে পক্ষ (১ থেকে ১০)</h3>
    <div class="grid" id="chandro-grid"></div>
  </div>

  <!-- ৩. ইংরেজি বর্ণমালা ও 1 to 100 -->
  <div id="english" class="content-section">
    <h2>English Alphabets (A to Z)</h2>
    <div class="grid" id="english-grid"></div>

    <h3 class="sub-title">Numbers (1 to 100)</h3>
    <div class="grid" id="num-grid" style="grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));"></div>
  </div>

  <!-- ৪. বিভিন্ন দেশ -->
  <div id="countries" class="content-section">
    <h2>বিভিন্ন দেশের নাম (৫০টি দেশ)</h2>
    <div class="grid" id="countries-grid"></div>
  </div>

  <!-- ৫. মহাসাগরের পরিচয় -->
  <div id="oceans" class="content-section">
    <h2>পৃথিবীর ৫টি মহাসাগর</h2>
    <div class="grid" id="oceans-grid"></div>
  </div>

  <!-- ৬. বিভিন্ন জীবজন্তুর পরিচয় -->
  <div id="animals" class="content-section">
    <h2>৫০টি জীবজন্তুর নাম ও ছবি</h2>
    <div class="grid" id="animals-grid"></div>
  </div>

  <script>
    let availableVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) { availableVoices = window.speechSynthesis.getVoices(); }
    }
    loadVoices();
    if ('speechSynthesis' in window) { window.speechSynthesis.onvoiceschanged = loadVoices; }

    function speak(text, lang = 'bn') {
      if (!('speechSynthesis' in window)) return;
      
      // সাউন্ড আটকে গেলে চালুর ব্যবস্থা
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      if (lang === 'bn') {
        const bnVoice = availableVoices.find(v => v.lang.includes('bn') || v.lang.toLowerCase().includes('bengali') || v.lang === 'bn-IN' || v.lang === 'bn-BD');
        if (bnVoice) utterance.voice = bnVoice;
        utterance.lang = 'bn-IN';
        utterance.rate = 0.8;
      } else {
        const enVoice = availableVoices.find(v => v.lang.includes('en'));
        if (enVoice) utterance.voice = enVoice;
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
      }
      window.speechSynthesis.speak(utterance);
    }

    function showSection(id, btnElement) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active-section'));
      document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(id).classList.add('active-section');
      btnElement.classList.add('active');
    }

    // Colors - (ইংরেজি নাম ও ইংরেজি সাউন্ড)
    const colors = [
      {name: "লাল", en: "Red", hex: "#ff3838"},
      {name: "নীল", en: "Blue", hex: "#17c0eb"},
      {name: "সবুজ", en: "Green", hex: "#3ae374"},
      {name: "হলুদ", en: "Yellow", hex: "#fffa65"},
      {name: "কমলা", en: "Orange", hex: "#ff9f1a"},
      {name: "গোলাপী", en: "Pink", hex: "#ff9ff3"},
      {name: "বেগুনি", en: "Purple", hex: "#8854d0"},
      {name: "কালো", en: "Black", hex: "#2f3542"},
      {name: "সাদা", en: "White", hex: "#ffffff"},
      {name: "বাদামী", en: "Brown", hex: "#795548"}
    ];
    const colorsGrid = document.getElementById('colors-grid');
    colors.forEach(c => { 
      const card = document.createElement('div'); 
      card.className = 'card'; 
      card.onclick = () => speak(c.en, 'en'); 
      card.innerHTML = `<div class="color-box" style="background-color: ${c.hex};"></div><div class="title">${c.name}</div><div class="subtext" style="font-weight:bold; color:#2d3436;">${c.en}</div>`; 
      colorsGrid.appendChild(card); 
    });

    // Swaravarna
    const swaravarna = [
      {letter: 'অ', word: 'অজগর'}, {letter: 'আ', word: 'আম'}, {letter: 'ই', word: 'ইঁদুর'}, 
      {letter: 'ঈ', word: 'ঈগল'}, {letter: 'উ', word: 'উট'}, {letter: 'ঊ', word: 'ঊষা'}, 
      {letter: 'ঋ', word: 'ঋষি'}, {letter: 'এ', word: 'একতারা'}, {letter: 'ঐ', word: 'ঐরাবত'}, 
      {letter: 'ও', word: 'ওল'}, {letter: 'ঔ', word: 'ঔষধ'}
    ];
    const swarGrid = document.getElementById('swar-grid');
    swaravarna.forEach(item => { 
      const card = document.createElement('div'); 
      card.className = 'card'; 
      card.onclick = () => speak(`${item.letter}, ${item.letter}-তে ${item.word}`, 'bn'); 
      card.innerHTML = `<div class="icon" style="color: #e84393;">${item.letter}</div><div class="subtext">${item.word}</div>`; 
      swarGrid.appendChild(card); 
    });

    // Byanjanvarna
    const byanjanvarna = ['ক','খ','গ','ঘ','ঙ','চ','ছ','জ','ঝ','ঞ','ট','ঠ','ড','ঢ','ণ','ত','থ','দ','ধ','ন','প','ফ','ব','ভ','ম','য','র','ল','শ','ষ','স','হ','ড়','ঢ়','য়','ৎ','ং','ঃ','ঁ'];
    const byanjanGrid = document.getElementById('byanjan-grid');
    byanjanvarna.forEach(l => { 
      const card = document.createElement('div'); 
      card.className = 'card'; 
      card.onclick = () => speak(l, 'bn'); 
      card.innerHTML = `<div class="icon" style="color: #0984e3;">${l}</div>`; 
      byanjanGrid.appendChild(card); 
    });

    // Numbers 1-10
    const chandroData = [
      {num: '১', text: 'একে চন্দ্র'}, {num: '২', text: 'দুয়ে পক্ষ'}, {num: '৩', text: 'তিনে নেত্র'}, 
      {num: '৪', text: 'চারে বেদ'}, {num: '৫', text: 'পাঁচে বাণ'}, {num: '৬', text: 'ছয়ে ঋতু'}, 
      {num: '৭', text: 'সাতে সমুদ্র'}, {num: '৮', text: 'আটে বসু'}, {num: '৯', text: 'নয়ে নবগ্রহ'}, {num: '১০', text: 'দশে দিক'}
    ];
    const chandroGrid = document.getElementById('chandro-grid');
    chandroData.forEach(item => { 
      const card = document.createElement('div'); 
      card.className = 'card'; 
      card.onclick = () => speak(item.text, 'bn'); 
      card.innerHTML = `<div class="icon" style="color: #6c5ce7; font-weight: bold;">${item.num}</div><div class="title" style="font-size:1rem;">${item.text}</div>`; 
      chandroGrid.appendChild(card); 
    });

    // English Alphabet
    const alphabet = [
      {l: "A", w: "Apple", ico: "🍎"}, {l: "B", w: "Ball", ico: "⚽"}, {l: "C", w: "Cat", ico: "🐱"}, 
      {l: "D", w: "Dog", ico: "🐶"}, {l: "E", w: "Elephant", ico: "🐘"}, {l: "F", w: "Fish", ico: "🐟"}, 
      {l: "G", w: "Grapes", ico: "🍇"}, {l: "H", w: "Horse", ico: "🐴"}, {l: "I", w: "Ice Cream", ico: "🍦"}, 
      {l: "J", w: "Jug", ico: "🫖"}, {l: "K", w: "Kite", ico: "🪁"}, {l: "L", w: "Lion", ico: "🦁"}, 
      {l: "M", w: "Monkey", ico: "🐒"}, {l: "N", w: "Nest", ico: "🪺"}, {l: "O", w: "Orange", ico: "🍊"}, 
      {l: "P", w: "Parrot", ico: "🦜"}, {l: "Q", w: "Queen", ico: "👑"}, {l: "R", w: "Rose", ico: "🌹"}, 
      {l: "S", w: "Sun", ico: "☀️"}, {l: "T", w: "Tiger", ico: "🐯"}, {l: "U", w: "Umbrella", ico: "☂️"}, 
      {l: "V", w: "Van", ico: "🚐"}, {l: "W", w: "Watch", ico: "⌚"}, {l: "X", w: "Xylophone", ico: "🎵"}, 
      {l: "Y", w: "Yak", ico: "🐂"}, {l: "Z", w: "Zebra", ico: "🦓"}
    ];
    const engGrid = document.getElementById('english-grid');
    alphabet.forEach(item => { 
      const card = document.createElement('div'); 
      card.className = 'card'; 
      card.onclick = () => speak(`${item.l} for ${item.w}`, 'en'); 
      card.innerHTML = `<div class="icon">${item.ico}</div><div class="title">${item.l}</div><div class="subtext">${item.w}</div>`; 
      engGrid.appendChild(card); 
    });

    // English Numbers 1-100
    const numGrid = document.getElementById('num-grid');
    for (let i = 1; i <= 100; i++) { 
      const card = document.createElement('div'); 
      card.className = 'card num-card'; 
      card.onclick = () => speak(i.toString(), 'en'); 
      card.innerText = i; 
      numGrid.appendChild(card); 
    }

    // ৫০টি দেশ (কার্ডের কালার, ইংরেজি নাম ও সাউন্ড সহ)
    const countries = [
      { name: "ভারত", en: "India", flag: "🇮🇳", color: "#ffcccc" },
      { name: "বাংলাদেশ", en: "Bangladesh", flag: "🇧🇩", color: "#ccffcc" },
      { name: "পাকিস্তান", en: "Pakistan", flag: "🇵🇰", color: "#e6ffcc" },
      { name: "নেপাল", en: "Nepal", flag: "🇳🇵", color: "#cce5ff" },
      { name: "ভুটান", en: "Bhutan", flag: "🇧🇹", color: "#ffffcc" },
      { name: "শ্রীলঙ্কা", en: "Sri Lanka", flag: "🇱🇰", color: "#ffe6cc" },
      { name: "মালদ্বীপ", en: "Maldives", flag: "🇲🇻", color: "#ccffff" },
      { name: "আফগানিস্তান", en: "Afghanistan", flag: "🇦🇫", color: "#f2f2f2" },
      { name: "চীন", en: "China", flag: "🇨🇳", color: "#ffe6f2" },
      { name: "জাপান", en: "Japan", flag: "🇯🇵", color: "#ffccff" },
      { name: "দক্ষিণ কোরিয়া", en: "South Korea", flag: "🇰🇷", color: "#e6e6ff" },
      { name: "সৌদি আরব", en: "Saudi Arabia", flag: "🇸🇦", color: "#d9f2e6" },
      { name: "সংযুক্ত আরব আমিরাত", en: "UAE", flag: "🇦🇪", color: "#fff0f5" },
      { name: "থাইল্যান্ড", en: "Thailand", flag: "🇹🇭", color: "#e6fffa" },

      { name: "কাতার", en: "Qatar", flag: "🇶🇦", color: "#f5e6cc" },
      { name: "ওমান", en: "Oman", flag: "🇴🇲", color: "#e6f2ff" },
      { name: "রাশিয়া", en: "Russia", flag: "🇷🇺", color: "#f2e6ff" },
      { name: "ইংল্যান্ড", en: "England", flag: "🇬🇧", color: "#e6ffff" },
      { name: "ফ্রান্স", en: "France", flag: "🇫🇷", color: "#e6ffe6" },
      { name: "জার্মানি", en: "Germany", flag: "🇩🇪", color: "#ffebd6" },
      { name: "ইতালি", en: "Italy", flag: "🇮🇹", color: "#e6ffea" },
      { name: "স্পেন", en: "Spain", flag: "🇪🇸", color: "#fff0c2" },
      { name: "পর্তুগাল", en: "Portugal", flag: "🇵🇹", color: "#d6f5d6" },
      { name: "সুইজারল্যান্ড", en: "Switzerland", flag: "🇨🇭", color: "#ffe6e6" },
      { name: "নেদারল্যান্ডস", en: "Netherlands", flag: "🇳🇱", color: "#e6f5ff" },
      { name: "বেলজিয়াম", en: "Belgium", flag: "🇧🇪", color: "#ffffcc" },
      { name: "আর্জেন্টিনা", en: "Argentina", flag: "🇦🇷", color: "#ebebe0" },
      { name: "ব্রাজিল", en: "Brazil", flag: "🇧🇷", color: "#d6f5f5" },
      { name: "আমেরিকা", en: "America", flag: "🇺🇸", color: "#e6ccff" },
      { name: "কানাডা", en: "Canada", flag: "🇨🇦", color: "#ffccd5" },
      { name: "মেক্সিকো", en: "Mexico", flag: "🇲🇽", color: "#e6ffcc" },
      { name: "অস্ট্রেলিয়া", en: "Australia", flag: "🇦🇺", color: "#ffecb3" },
      { name: "নিউজিল্যান্ড", en: "New Zealand", flag: "🇳🇿", color: "#d1e0e0" },
      { name: "মিশর", en: "Egypt", flag: "🇪🇬", color: "#fff2cc" },
      { name: "দক্ষিণ আফ্রিকা", en: "South Africa", flag: "🇿🇦", color: "#e0f2fe" },
